name: Build and deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build GitHub Pages site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || vars.ZENITH_API_BASE_URL }}
        run: |
          flutter build web --release --base-href /Zenith/ \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=BACKEND_URL="$API_BASE_URL"
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
